    <main class="committee-content">
        <h1>HORROR SOCIETY PRESENTS</h1>
        <div class="committee-profiles">
            <figure class="committee-member">
                <h3>RHYS<span> as</span></h3>
                <img src="styles/committee/rhys.jpeg" alt="Rhys">
                <h2 class="role">THE PRESIDENT</h2>
                <div></div>
                <p class="bio">
                    Hello! I'm Rhys, a 3rd year computer science student. After an amazing two years at Horror Soc I am at least somewhat qualified/excited to lead it. I sure hope nothing bad happens...</p>
            </figure>
            <figure class="committee-member">
                <h3>LEWIS<span> as</span></h3>
                <img src="styles/committee/lewis.jpeg" alt="Lewis">
                <h2 class="role">THE SECRETARY</h2>
                <div></div>
                <p class="bio">
                    Hi everyone! I'm Lewis, I'm a second year history student and here for my second year as part of your committee but now as your secretary. I'm looking forward to a great year full of scary movies, terrifying special events and horrific nights out. The best days of the society have only just begun!</p>
            </figure>
            <figure class="committee-member">
                <h3>JAKE<span> as</span></h3>
                <img src="styles/committee/jake.jpeg" alt="Jake">
                <h2 class="role">THE TREASURER</h2>
                <div></div>
                <p class="bio">
                    Hi everyone, I’m Jake. I’m a Law and Criminology student in my final year. I’m new on the committee and excited to get stuck in as treasurer.</p>
            </figure>
            <figure class="committee-member">
                <h3>SAMMY<span> as</span></h3>
                <img src="styles/committee/sammy.jpeg" alt="Sammy">
                <h2 class="role">THE INCLUSIONS/TECH OFFICER</h2>
                <div></div>
                <p class="bio">
                    Hey, I’m Sammy! I’m a 1st year Robotics student and I have a passion for all things spooky. You’ll usually find me putting together whatever outfits I can find (like The Nun
                    pictured) and making a fool of myself.
                    I can’t wait to spend the next year watching horror movies!</p>
            </figure>
            <figure class="committee-member">
                <h3>JACK<span> as</span></h3>
                <img src="styles/committee/jack.jpeg" alt="Jack">
                <h2 class="role">THE LIBRARIAN</h2>
                <div></div>
                <p class="bio">
                Hello, my name is Jack, I'm a second year student studying nursing. I am a devoted worshipper of the unseen and the unsettling which makes me the perfect curator for the Horror Soc collection. Don't feed me after midnight and we will get on just fine.</p>
            </figure>
