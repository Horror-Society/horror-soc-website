<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Calendar</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="navbar">
        <a href="index.html">
            <img class="navbar-logo" src="styles/logo.png" alt="Logo" class="logo">
        </a>
        <ul class="topnav-buttons calendar-topnav">
            <li><a href="about.html">ABOUT US</a></li>
            <li><a href="committee.html">OUR COMMITTEE</a></li>
            <li><a href="rental.html">RENTAL LIST</a></li>
        </ul>
    </div>
    <main class="calendar-content">
        <div class="month">
            <button class="arrow-button" id="prev-month" onclick="previousMonth()">
                <img src="styles/left-arrow.png" alt="Prev">
            </button>
            <h2 id="month-title"></h2>
            <button class="arrow-button" id="next-month" onclick="nextMonth()">
                <img src="styles/right-arrow.png" alt="Next">
            </button>
        </div>
        <div class="dow">
            <ul>
                <li>Mon</li>
                <li>Tue</li>
                <li>Wed</li>
                <li>Thu</li>
                <li>Fri</li>
                <li>Sat</li>
                <li>Sun</li>
            </ul>
        </div>
        <div id="days" class="days">
        </div>
    </main>
    <footer class="calendar-footer">
        <a href="https://www.instagram.com/horrorsoc/">
            <img src="styles/instagram.png" alt="Instagram" class="social-icon">
        </a>
        <p>&copy; 2026 University of Sheffield Horror Society</p>
        <a href="https://discord.gg/EJqsHuTgBb">
            <img src="styles/discord.png" alt="Discord" class="social-icon">
        </a>
    </footer>
    <script src="scripts/calendar.js"></script>
</body>
